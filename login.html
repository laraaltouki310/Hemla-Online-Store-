<!DOCTYPE html>
<html lang="en">
<head>

                <div class="login-icons">

                </div>
                    <div class="data-user">

                            <input type="password" checked placeholder=" ******** ">

                            <input id="loginBtn" type="button" value="تسجيل الدخول ">
                        </div>
                    </div>
                </div>
            </div>
        </nav>

    <script src="login.js"></script>
